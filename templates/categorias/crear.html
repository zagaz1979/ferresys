{% extends "base.html" %}

{% block title %}Nueva Categoría{% endblock %}

{% block content %}
    <h1>Nueva Categoría</h1>
    <form method="POST" class="form">
        <label>Nombre
            <input type="text" name="nombre" required maxlength="50">
        </label>
        <label>Descripción
            <input type="text" name="descripcion" maxlength="150">
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('categorias.index') }}" class="btn">Cancelar</a>
        </div>
    </form>
{% endblock %}
