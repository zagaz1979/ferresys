{% extends "base.html" %}

{% block title %}Editar Categoría{% endblock %}

{% block content %}
    <h1>Editar Categoría</h1>
    <form method="POST" class="form">
        <label>Nombre
            <input type="text" name="nombre" value="{{ categoria.nombre }}" required maxlength="50">
        </label>
        <label>Descripción
            <input type="text" name="descripcion" value="{{ categoria.descripcion or '' }}" maxlength="150">
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Actualizar</button>
            <a href="{{ url_for('categorias.index') }}" class="btn">Cancelar</a>
        </div>
    </form>
{% endblock %}
