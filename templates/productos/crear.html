{% extends "base.html" %}

{% block title %}Nuevo Producto{% endblock %}

{% block content %}
    <h1>Nuevo Producto</h1>
    <form method="POST" class="form">
        <label>Código de Barras
            <input type="text" name="codigo_barras" required maxlength="30">
        </label>
        <label>Nombre
            <input type="text" name="nombre" required maxlength="100">
        </label>
        <div class="form-row">
            <label>Precio Compra
                <input type="number" step="0.01" min="0" name="precio_compra" required>
            </label>
            <label>Precio Venta
                <input type="number" step="0.01" min="0" name="precio_venta" required>
            </label>
        </div>
        <div class="form-row">
            <label>Stock
                <input type="number" min="0" name="stock" value="0" required>
            </label>
            <label>Stock Mínimo
                <input type="number" min="0" name="stock_minimo" value="5" required>
            </label>
        </div>
        <label>Categoría
            <select name="id_categoria">
                <option value="">— Sin categoría —</option>
                {% for c in categorias %}
                <option value="{{ c.id_categoria }}">{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('productos.index') }}" class="btn">Cancelar</a>
        </div>
    </form>
{% endblock %}
