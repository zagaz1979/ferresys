[project]
name = "ferresys"
version = "0.1.0"
description = "Sistema de gestión de inventario y ventas para ferretería (MVC + Flask + MySQL)"
readme = "README.md"
authors = [
    { name = "Cesar Garcia", email = "cesar.garcia.suarez@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ferresys = "ferresys:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
